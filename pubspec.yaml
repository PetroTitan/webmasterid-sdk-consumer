name: webmasterid_consumer
description: A minimal customer app that installs the WebmasterID Flutter SDK exactly as the installation guide says.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # The WebmasterID SDK, from pub.dev. No Git URL, no path, no override.
  webmasterid_flutter: ^0.3.0
  # Where this app keeps the consent decision between launches.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
